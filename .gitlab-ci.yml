stages:
  - build-frontend-stage
  - build-server
  - build-docker
  #  - build
#  - push-images

variables:
  GO_VERSION: "1.24.6"
  OPENSEARCH_VERSION: "2.7.0"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

.on-commit-to-master: &on-commit-to-master
  if: '$CI_COMMIT_BRANCH == "master"'

.on-commit-to-stage: &on-commit-to-stage
  if: '$CI_COMMIT_BRANCH == "stage"'

# Helper function to download artifacts from previous pipeline
# Using docker:24 image (Alpine-based), installing curl, jq and unzip
# This image runs as root by default, so package installation should work
.download-artifacts-template: &download-artifacts-template
  image: docker:24
  before_script:
    - apk add --no-cache curl jq unzip
  script:
    - |
      echo "Searching for artifacts from previous successful pipeline..."
      echo "Looking for artifacts from job: ${ARTIFACT_JOB_NAME}"
      echo "Project ID: ${CI_PROJECT_ID}"
      echo "Project Path: ${CI_PROJECT_PATH}"
      echo "API URL: ${CI_API_V4_URL}"
      echo "Branch: ${CI_COMMIT_REF_NAME}"

      # Use GITLAB_API_TOKEN if available, otherwise fallback to CI_JOB_TOKEN
      # GITLAB_API_TOKEN should be a Project Access Token with 'read_api' scope
      if [ -n "${GITLAB_API_TOKEN}" ]; then
        API_TOKEN="${GITLAB_API_TOKEN}"
        echo "Using GITLAB_API_TOKEN for API access"
      else
        API_TOKEN="${CI_JOB_TOKEN}"
        echo "Using CI_JOB_TOKEN for API access (may have limited permissions)"
      fi

      # Try using numeric project ID first, then fallback to URL-encoded path
      # Some GitLab instances work better with numeric ID
      PROJECT_ID_OR_PATH="${CI_PROJECT_ID}"
      if [ -z "$PROJECT_ID_OR_PATH" ] || [ "$PROJECT_ID_OR_PATH" = "null" ] || [ "$PROJECT_ID_OR_PATH" = "" ]; then
        PROJECT_ID_OR_PATH=$(echo "${CI_PROJECT_PATH}" | sed 's/\//%2F/g')
      fi
      echo "Using project identifier: ${PROJECT_ID_OR_PATH}"

      # First, test if we can access the project API
      TEST_RESPONSE=$(curl -s -w "\n%{http_code}" --header "PRIVATE-TOKEN: ${API_TOKEN}" \
        "${CI_API_V4_URL}/projects/${PROJECT_ID_OR_PATH}")
      TEST_HTTP_CODE=$(echo "$TEST_RESPONSE" | tail -n 1)
      TEST_BODY=$(echo "$TEST_RESPONSE" | head -n -1)

      if [ "$TEST_HTTP_CODE" != "200" ]; then
        echo "WARNING: Cannot access project API. HTTP code: $TEST_HTTP_CODE"
        echo "Response: $TEST_BODY"
        echo "This might indicate insufficient permissions for CI_JOB_TOKEN"
        echo "Trying alternative: using project path..."

        # Try with URL-encoded path if ID didn't work
        if [ "$PROJECT_ID_OR_PATH" = "${CI_PROJECT_ID}" ]; then
          PROJECT_ID_OR_PATH=$(echo "${CI_PROJECT_PATH}" | sed 's/\//%2F/g')
          echo "Retrying with project path: ${PROJECT_ID_OR_PATH}"
          TEST_RESPONSE=$(curl -s -w "\n%{http_code}" --header "PRIVATE-TOKEN: ${API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${PROJECT_ID_OR_PATH}")
          TEST_HTTP_CODE=$(echo "$TEST_RESPONSE" | tail -n 1)
          if [ "$TEST_HTTP_CODE" != "200" ]; then
            echo "ERROR: Cannot access project with either ID or path"
            echo ""
            echo "SOLUTION: Create a Project Access Token and add it as CI/CD variable:"
            echo "1. Go to Settings → Access Tokens"
            echo "2. Create token with 'read_api' and 'read_repository' scopes"
            echo "3. Add it as CI/CD variable 'GITLAB_API_TOKEN'"
            echo ""
            echo "Alternatively, if this is the first pipeline, artifacts will be created"
            echo "in the next pipeline run. For now, this job will fail gracefully."
            exit 1
          fi
        else
          echo "ERROR: Cannot access project API"
          exit 1
        fi
      fi

      # Get the last successful pipeline for this branch
      PIPELINES_RESPONSE=$(curl -s -w "\n%{http_code}" --header "PRIVATE-TOKEN: ${API_TOKEN}" \
        "${CI_API_V4_URL}/projects/${PROJECT_ID_OR_PATH}/pipelines?ref=${CI_COMMIT_REF_NAME}&status=success&per_page=5")

      HTTP_CODE=$(echo "$PIPELINES_RESPONSE" | tail -n 1)
      PIPELINES=$(echo "$PIPELINES_RESPONSE" | head -n -1)

      if [ "$HTTP_CODE" != "200" ]; then
        echo "ERROR: Failed to fetch pipelines. HTTP code: $HTTP_CODE"
        echo "Response: $PIPELINES"
        exit 1
      fi

      # Check if response is valid JSON array
      if ! echo "$PIPELINES" | jq -e '. | type == "array"' >/dev/null 2>&1; then
        echo "ERROR: Invalid JSON response from API"
        echo "Response: $PIPELINES"
        exit 1
      fi

      PIPELINE_COUNT=$(echo "$PIPELINES" | jq '. | length')
      echo "Found $PIPELINE_COUNT successful pipeline(s) to check"

      ARTIFACTS_FOUND=false

      # Try to find pipeline with artifacts
      for pipeline_id in $(echo "$PIPELINES" | jq -r '.[].id' 2>/dev/null); do
        if [ -z "$pipeline_id" ] || [ "$pipeline_id" = "null" ]; then
          continue
        fi

        echo "Checking pipeline ${pipeline_id}..."

        # Get jobs from this pipeline
        JOBS_RESPONSE=$(curl -s -w "\n%{http_code}" --header "PRIVATE-TOKEN: ${API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${PROJECT_ID_OR_PATH}/pipelines/${pipeline_id}/jobs")

        JOBS_HTTP_CODE=$(echo "$JOBS_RESPONSE" | tail -n 1)
        JOBS=$(echo "$JOBS_RESPONSE" | head -n -1)

        if [ "$JOBS_HTTP_CODE" != "200" ]; then
          echo "WARNING: Failed to fetch jobs for pipeline ${pipeline_id}. HTTP code: $JOBS_HTTP_CODE"
          continue
        fi

        # Check if jobs response is valid JSON
        if ! echo "$JOBS" | jq -e '. | type == "array"' >/dev/null 2>&1; then
          echo "WARNING: Invalid JSON response for jobs in pipeline ${pipeline_id}"
          continue
        fi

        # Find the job with artifacts
        JOB_ID=$(echo "$JOBS" | jq -r ".[] | select(.name==\"${ARTIFACT_JOB_NAME}\" and .artifacts_file!=null) | .id" 2>/dev/null | head -n 1)

        if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ] && [ "$JOB_ID" != "" ]; then
          echo "Found artifacts in job ${JOB_ID} from pipeline ${pipeline_id}"

          # Download artifacts
          ARTIFACT_HTTP_CODE=$(curl -s -w "%{http_code}" -o artifacts.zip --header "PRIVATE-TOKEN: ${API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${PROJECT_ID_OR_PATH}/jobs/${JOB_ID}/artifacts")

          if [ "$ARTIFACT_HTTP_CODE" = "200" ] && [ -f artifacts.zip ] && [ -s artifacts.zip ]; then
            # Use -o flag to overwrite files without prompting
            unzip -o -q artifacts.zip
            ARTIFACTS_FOUND=true
            echo "Artifacts downloaded successfully from pipeline ${pipeline_id}"
            echo "Artifacts contents:"
            ls -la || true
            break
          else
            echo "WARNING: Failed to download artifacts from job ${JOB_ID}. HTTP code: $ARTIFACT_HTTP_CODE"
            rm -f artifacts.zip
          fi
        fi
      done

      if [ "$ARTIFACTS_FOUND" = false ]; then
        echo "ERROR: No artifacts found in previous successful pipelines."
        echo "This might happen if:"
        echo "  1. This is the first pipeline for this branch"
        echo "  2. All previous pipelines failed"
        echo "  3. Artifacts expired (current expire_in: 2 days)"
        echo "  4. The job '${ARTIFACT_JOB_NAME}' never ran successfully in previous pipelines"
        echo "Please ensure at least one successful pipeline exists with artifacts."
        exit 1
      fi
  artifacts:
    expire_in: 60 days
    when: always

# Build backend (Go server)
# Note: make package requires frontend to be built in webapp/channels/dist/
# This job runs AFTER frontend stage and uses frontend artifacts from either:
# - build-frontend (if frontend was changed) or
# - download-frontend-artifacts (if frontend wasn't changed)
# Backend is rebuilt when either backend or frontend changes, because backend package includes frontend
build-backend:
  stage: build-server
  image: mattermost/mattermost-build-server:${GO_VERSION}
  rules:
    - <<: *on-commit-to-master
      changes:
        - server/**/*
        - webapp/**/*
    - <<: *on-commit-to-stage
      changes:
        - server/**/*
        - webapp/**/*
  variables:
    GOFLAGS: -buildvcs=false
    BUILD_NUMBER: "${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
  needs:
    # Wait for frontend to be built or downloaded before building backend
    # GitLab CI will use artifacts from whichever job completed (build-frontend or download-frontend-artifacts)
    # Using optional: true allows the job to proceed even if one of the frontend jobs didn't run
    - job: build-frontend
      optional: true
    - job: download-frontend-artifacts
      optional: true
  dependencies:
    # Download artifacts from frontend jobs (whichever ran)
    - build-frontend
    - download-frontend-artifacts
  before_script:
    - cd server
    - make setup-go-work
    # Verify that frontend is available (either from build or download)
    - |
      if [ ! -d "../webapp/channels/dist" ] || [ -z "$(ls -A ../webapp/channels/dist 2>/dev/null)" ]; then
        echo "ERROR: Frontend dist directory is missing or empty!"
        echo "Frontend must be built or downloaded before building backend package."
        echo "The package-prep step requires webapp/channels/dist/* to be present."
        exit 1
      fi
      echo "Frontend dist found, proceeding with backend package build..."
  script:
    - make config-reset
    - make build-cmd
    - make package
  artifacts:
    paths:
      - server/dist/
      - server/build/
    expire_in: 60 days
    when: always

# Download backend artifacts from previous pipeline if no changes
# Note: Backend artifacts are downloaded only if there are NO changes in both server and webapp
# If either server or webapp changed, build-backend will run instead
download-backend-artifacts:
  stage: build-server
  <<: *download-artifacts-template
  variables:
    ARTIFACT_JOB_NAME: "build-backend"
  rules:
    # Run only if on master/stage branch and server directory exists, but no changes in server or webapp
    - <<: *on-commit-to-master
      exists:
        - server/**/*
      changes:
        - server/**/*
        - webapp/**/*
      when: never
    - <<: *on-commit-to-master
      exists:
        - server/**/*
    - <<: *on-commit-to-stage
      exists:
        - server/**/*
      changes:
        - server/**/*
        - webapp/**/*
      when: never
    - <<: *on-commit-to-stage
      exists:
        - server/**/*
  artifacts:
    paths:
      - server/dist/
      - server/build/
    expire_in: 60 days
    when: always

# Build frontend (webapp)
# This runs first, before backend build
build-frontend:
  stage: build-frontend-stage
  image: mattermost/mattermost-build-server:${GO_VERSION}
  rules:
    - <<: *on-commit-to-master
      changes:
        - webapp/**/*
    - <<: *on-commit-to-stage
      changes:
        - webapp/**/*
  before_script:
    - cd webapp
    - npm ci --include=dev
  script:
    - npm run build
  artifacts:
    paths:
      - webapp/channels/dist/
    expire_in: 60 days
    when: always

# Download frontend artifacts from previous pipeline if no changes
# This runs first, before backend build
download-frontend-artifacts:
  stage: build-frontend-stage
  <<: *download-artifacts-template
  variables:
    ARTIFACT_JOB_NAME: "build-frontend"
  rules:
    # Run only if on master/stage branch and webapp directory exists, but no changes in webapp
    - <<: *on-commit-to-master
      exists:
        - webapp/**/*
      changes:
        - webapp/**/*
      when: never
    - <<: *on-commit-to-master
      exists:
        - webapp/**/*
    - <<: *on-commit-to-stage
      exists:
        - webapp/**/*
      changes:
        - webapp/**/*
      when: never
    - <<: *on-commit-to-stage
      exists:
        - webapp/**/*
  artifacts:
    paths:
      - webapp/channels/dist/
    expire_in: 60 days
    when: always

# Build Docker image
build-docker:
  stage: build-docker
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      entrypoint: ["dockerd-entrypoint.sh"]
      command: ["dockerd", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
    DOCKER_DRIVER: overlay2
  rules:
    - *on-commit-to-master
    - *on-commit-to-stage
  dependencies:
    # Use artifacts from either build jobs or download jobs
    # GitLab CI will use artifacts from whichever jobs ran
    - build-backend
    - download-backend-artifacts
    - build-frontend
    - download-frontend-artifacts
  before_script:
    - |
      export DOCKER_HOST=tcp://docker:2375
      echo "Waiting for Docker daemon..."
      timeout=60
      elapsed=0
      until docker info >/dev/null 2>&1; do
        if [ $elapsed -ge $timeout ]; then
          echo "ERROR: Docker daemon did not become ready within ${timeout}s"
          exit 1
        fi
        echo "Docker daemon not ready, waiting... (${elapsed}s/${timeout}s)"
        sleep 2
        elapsed=$((elapsed + 2))
      done
    - apk add --no-cache python3 curl
    - docker buildx version || docker buildx install
    - docker buildx create --use --name builder --driver docker-container --driver-opt network=host || true
    - |
      if [ -n "${REGISTRY_HOST}" ] && [ -n "${REGISTRY_USERNAME}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        echo "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USERNAME}" --password-stdin "${REGISTRY_HOST}"
      else
        echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
      fi
  script:
    - |
      # Note: The package file (tar.gz) already contains the frontend inside it.
      # During build-backend, make package copies webapp/channels/dist/* into server/dist/mattermost/client/
      # So the Docker image will have both backend and frontend from this single package file.

      # Show current directory and structure
      echo "Current directory: $(pwd)"
      echo "Directory structure:"
      ls -la || true

      # Find the built package
      PACKAGE_FILE=$(find server/dist -name "mattermost-*-linux-amd64.tar.gz" | head -n 1)
      if [ -z "$PACKAGE_FILE" ]; then
        echo "ERROR: Package file not found in server/dist/"
        ls -la server/dist/ || true
        exit 1
      fi

      echo "Found package: $PACKAGE_FILE"
      PACKAGE_NAME=$(basename "$PACKAGE_FILE")

      # Ensure server/build directory exists (it should be in the repo)
      if [ ! -d "server/build" ]; then
        echo "ERROR: server/build directory not found"
        echo "Available directories:"
        ls -la server/ || true
        exit 1
      fi

      # Copy package to build context directory
      # We'll modify the Dockerfile to use COPY instead of curl
      # This avoids network issues with HTTP server in buildx environment
      cp "$PACKAGE_FILE" server/build/package.tar.gz

      # Set image tags
      if [ -n "${REGISTRY_HOST}" ]; then
        tag="${REGISTRY_HOST}/${CI_PROJECT_PATH}/server:${CI_COMMIT_SHORT_SHA}"
        branch_tag="${REGISTRY_HOST}/${CI_PROJECT_PATH}/server:${CI_COMMIT_BRANCH}"
      else
        tag="${CI_REGISTRY_IMAGE}/server:${CI_COMMIT_SHORT_SHA}"
        branch_tag="${CI_REGISTRY_IMAGE}/server:${CI_COMMIT_BRANCH}"
      fi

      # Create temporary Dockerfile by modifying the original
      # Replace curl download with COPY command
      # The original RUN command spans multiple lines:
      # RUN mkdir ... \
      #   && groupadd ... \
      #   && useradd ... \
      #   && curl -L $MM_PACKAGE | tar -xvz \
      #   && chown ...
      # We need to split it: close RUN after useradd, add COPY, then new RUN for tar+chown
      awk '
        BEGIN { prev_line = "" }
        /^ARG MM_PACKAGE=/ { next }
        /curl -L \$MM_PACKAGE \| tar -xvz/ {
          # Remove the backslash from previous line to close the RUN
          if (prev_line ~ / \\$/) {
            sub(/ \\$/, "", prev_line)
            print prev_line
          }
          # Add COPY and new RUN
          print "COPY package.tar.gz /tmp/package.tar.gz"
          # Get the next line (chown) and include it in new RUN
          getline next_line
          gsub(/^[[:space:]]*&&[[:space:]]*/, "", next_line)
          print "RUN tar -xzf /tmp/package.tar.gz -C / && rm /tmp/package.tar.gz \\"
          print "  && " next_line
          prev_line = ""
          next
        }
        {
          if (prev_line != "") print prev_line
          prev_line = $0
        }
        END { if (prev_line != "") print prev_line }
      ' server/build/Dockerfile > server/build/Dockerfile.tmp

      # Build using temporary Dockerfile with COPY instead of curl
      docker buildx build \
        --pull \
        --push \
        --platform linux/amd64 \
        -t "${tag}" \
        -t "${branch_tag}" \
        -f server/build/Dockerfile.tmp \
        server/build

      # Clean up temporary files
      rm -f server/build/Dockerfile.tmp server/build/package.tar.gz

# Build OpenSearch Docker image
# This job runs only when Dockerfile.opensearch is changed
build-opensearch:
  stage: build-docker
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      entrypoint: ["dockerd-entrypoint.sh"]
      command: ["dockerd", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
    DOCKER_DRIVER: overlay2
  rules:
    - <<: *on-commit-to-master
      changes:
        - server/build/Dockerfile.opensearch
    - <<: *on-commit-to-stage
      changes:
        - server/build/Dockerfile.opensearch
  before_script:
    - |
      export DOCKER_HOST=tcp://docker:2375
      echo "Waiting for Docker daemon..."
      timeout=60
      elapsed=0
      until docker info >/dev/null 2>&1; do
        if [ $elapsed -ge $timeout ]; then
          echo "ERROR: Docker daemon did not become ready within ${timeout}s"
          exit 1
        fi
        echo "Docker daemon not ready, waiting... (${elapsed}s/${timeout}s)"
        sleep 2
        elapsed=$((elapsed + 2))
      done
    - apk add --no-cache python3 curl
    - docker buildx version || docker buildx install
    - docker buildx create --use --name builder --driver docker-container --driver-opt network=host || true
    - |
      if [ -n "${REGISTRY_HOST}" ] && [ -n "${REGISTRY_USERNAME}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        echo "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USERNAME}" --password-stdin "${REGISTRY_HOST}"
      else
        echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
      fi
  script:
    - |
      # Set image tags
      if [ -n "${REGISTRY_HOST}" ]; then
        tag="${REGISTRY_HOST}/${CI_PROJECT_PATH}/opensearch:${OPENSEARCH_VERSION}"
        tag_latest="${REGISTRY_HOST}/${CI_PROJECT_PATH}/opensearch:latest"
      else
        tag="${CI_REGISTRY_IMAGE}/opensearch:${OPENSEARCH_VERSION}"
        tag_latest="${CI_REGISTRY_IMAGE}/opensearch:latest"
      fi

      # Build and push the OpenSearch image
      cd server/build
      docker buildx build \
        --pull \
        --push \
        --platform linux/amd64 \
        --build-arg OPENSEARCH_VERSION=${OPENSEARCH_VERSION} \
        -t "${tag}" \
        -t "${tag_latest}" \
        -f Dockerfile.opensearch \
        .
