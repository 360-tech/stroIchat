stages:
  - build-server
#  - build
#  - build-docker
#  - push-images

variables:
  GO_VERSION: "1.24.6"
  OPENSEARCH_VERSION: "2.7.0"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

.on-commit-to-master: &on-commit-to-master
  if: '$CI_COMMIT_BRANCH == "master"'

.on-commit-to-stage: &on-commit-to-stage
  if: '$CI_COMMIT_BRANCH == "stage"'

# Build backend (Go server)
build-backend:
  stage: build-server
  image: mattermost/mattermost-build-server:${GO_VERSION}
  rules:
    - <<: *on-commit-to-master
      changes:
        - server/**/*
    - <<: *on-commit-to-stage
      changes:
        - server/**/*
  variables:
    GOFLAGS: -buildvcs=false
    BUILD_NUMBER: "${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
  before_script:
    - cd server
    - make setup-go-work
  script:
    - make config-reset
    - make build-cmd
    - make package
  artifacts:
    paths:
      - server/dist/
      - server/build/
    expire_in: 2 days
    when: always

# Build frontend (webapp)
build-frontend:
  stage: build-server
  image: node:lts-alpine
  rules:
    - <<: *on-commit-to-master
      changes:
        - webapp/**/*
    - <<: *on-commit-to-stage
      changes:
        - webapp/**/*
  before_script:
    - cd webapp
    - npm ci --include=dev
  script:
    - npm run build
  artifacts:
    paths:
      - webapp/channels/dist/
    expire_in: 2 days
    when: always

