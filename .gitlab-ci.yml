stages:
  - build-frontend-stage
  - build-server
  - build-docker
  #  - build
#  - push-images

variables:
  GO_VERSION: "1.24.6"
  OPENSEARCH_VERSION: "2.7.0"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

.on-commit-to-master: &on-commit-to-master
  if: '$CI_COMMIT_BRANCH == "master"'

.on-commit-to-stage: &on-commit-to-stage
  if: '$CI_COMMIT_BRANCH == "stage"'

# Helper function to download artifacts from previous pipeline
# Using docker:24 image (Alpine-based), installing curl, jq and unzip
# This image runs as root by default, so package installation should work
.download-artifacts-template: &download-artifacts-template
  image: docker:24
  before_script:
    - apk add --no-cache curl jq unzip
  script:
    - |
      echo "Searching for artifacts from previous successful pipeline..."
      echo "Looking for artifacts from job: ${ARTIFACT_JOB_NAME}"

      # Get the last successful pipeline for this branch
      PIPELINES=$(curl -s --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines?ref=${CI_COMMIT_REF_NAME}&status=success&per_page=5")

      ARTIFACTS_FOUND=false

      # Try to find pipeline with artifacts
      for pipeline_id in $(echo "$PIPELINES" | jq -r '.[].id'); do
        echo "Checking pipeline ${pipeline_id}..."

        # Get jobs from this pipeline
        JOBS=$(curl -s --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${pipeline_id}/jobs")

        # Find the job with artifacts
        JOB_ID=$(echo "$JOBS" | jq -r ".[] | select(.name==\"${ARTIFACT_JOB_NAME}\" and .artifacts_file!=null) | .id" | head -n 1)

        if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ]; then
          echo "Found artifacts in job ${JOB_ID} from pipeline ${pipeline_id}"

          # Download artifacts
          curl -s --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
            --output artifacts.zip \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${JOB_ID}/artifacts"

          if [ -f artifacts.zip ] && [ -s artifacts.zip ]; then
            unzip -q artifacts.zip
            ARTIFACTS_FOUND=true
            echo "Artifacts downloaded successfully from pipeline ${pipeline_id}"
            echo "Artifacts contents:"
            ls -la || true
            break
          fi
        fi
      done

      if [ "$ARTIFACTS_FOUND" = false ]; then
        echo "ERROR: No artifacts found in previous successful pipelines."
        echo "This might happen if:"
        echo "  1. This is the first pipeline for this branch"
        echo "  2. All previous pipelines failed"
        echo "  3. Artifacts expired (current expire_in: 2 days)"
        echo "Please ensure at least one successful pipeline exists with artifacts."
        exit 1
      fi
  artifacts:
    expire_in: 2 days
    when: always

# Build backend (Go server)
# Note: make package requires frontend to be built in webapp/channels/dist/
# This job runs AFTER frontend stage and uses frontend artifacts from either:
# - build-frontend (if frontend was changed) or
# - download-frontend-artifacts (if frontend wasn't changed)
# Backend is rebuilt when either backend or frontend changes, because backend package includes frontend
build-backend:
  stage: build-server
  image: mattermost/mattermost-build-server:${GO_VERSION}
  rules:
    - <<: *on-commit-to-master
      changes:
        - server/**/*
        - webapp/**/*
    - <<: *on-commit-to-stage
      changes:
        - server/**/*
        - webapp/**/*
  variables:
    GOFLAGS: -buildvcs=false
    BUILD_NUMBER: "${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
  needs:
    # Wait for frontend to be built or downloaded before building backend
    # GitLab CI will use artifacts from whichever job completed (build-frontend or download-frontend-artifacts)
    # Using optional: true allows the job to proceed even if one of the frontend jobs didn't run
    - job: build-frontend
      optional: true
    - job: download-frontend-artifacts
      optional: true
  dependencies:
    # Download artifacts from frontend jobs (whichever ran)
    - build-frontend
    - download-frontend-artifacts
  before_script:
    - cd server
    - make setup-go-work
    # Verify that frontend is available (either from build or download)
    - |
      if [ ! -d "../webapp/channels/dist" ] || [ -z "$(ls -A ../webapp/channels/dist 2>/dev/null)" ]; then
        echo "ERROR: Frontend dist directory is missing or empty!"
        echo "Frontend must be built or downloaded before building backend package."
        echo "The package-prep step requires webapp/channels/dist/* to be present."
        exit 1
      fi
      echo "Frontend dist found, proceeding with backend package build..."
  script:
    - make config-reset
    - make build-cmd
    - make package
  artifacts:
    paths:
      - server/dist/
      - server/build/
    expire_in: 2 days
    when: always

# Download backend artifacts from previous pipeline if no changes
# Note: Backend artifacts are downloaded only if there are NO changes in both server and webapp
# If either server or webapp changed, build-backend will run instead
download-backend-artifacts:
  stage: build-server
  <<: *download-artifacts-template
  variables:
    ARTIFACT_JOB_NAME: "build-backend"
  rules:
    # Run only if on master/stage branch and server directory exists, but no changes in server or webapp
    - <<: *on-commit-to-master
      exists:
        - server/**/*
      changes:
        - server/**/*
        - webapp/**/*
      when: never
    - <<: *on-commit-to-master
      exists:
        - server/**/*
    - <<: *on-commit-to-stage
      exists:
        - server/**/*
      changes:
        - server/**/*
        - webapp/**/*
      when: never
    - <<: *on-commit-to-stage
      exists:
        - server/**/*
  artifacts:
    paths:
      - server/dist/
      - server/build/
    expire_in: 2 days
    when: always

# Build frontend (webapp)
# This runs first, before backend build
build-frontend:
  stage: build-frontend-stage
  image: mattermost/mattermost-build-server:${GO_VERSION}
  rules:
    - <<: *on-commit-to-master
      changes:
        - webapp/**/*
    - <<: *on-commit-to-stage
      changes:
        - webapp/**/*
  before_script:
    - cd webapp
    - npm ci --include=dev
  script:
    - npm run build
  artifacts:
    paths:
      - webapp/channels/dist/
    expire_in: 2 days
    when: always

# Download frontend artifacts from previous pipeline if no changes
# This runs first, before backend build
download-frontend-artifacts:
  stage: build-frontend-stage
  <<: *download-artifacts-template
  variables:
    ARTIFACT_JOB_NAME: "build-frontend"
  rules:
    # Run only if on master/stage branch and webapp directory exists, but no changes in webapp
    - <<: *on-commit-to-master
      exists:
        - webapp/**/*
      changes:
        - webapp/**/*
      when: never
    - <<: *on-commit-to-master
      exists:
        - webapp/**/*
    - <<: *on-commit-to-stage
      exists:
        - webapp/**/*
      changes:
        - webapp/**/*
      when: never
    - <<: *on-commit-to-stage
      exists:
        - webapp/**/*
  artifacts:
    paths:
      - webapp/channels/dist/
    expire_in: 2 days
    when: always

# Build Docker image
build-docker:
  stage: build-docker
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      entrypoint: ["dockerd-entrypoint.sh"]
      command: ["dockerd", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
    DOCKER_DRIVER: overlay2
  rules:
    - *on-commit-to-master
    - *on-commit-to-stage
  dependencies:
    # Use artifacts from either build jobs or download jobs
    # GitLab CI will use artifacts from whichever jobs ran
    - build-backend
    - download-backend-artifacts
    - build-frontend
    - download-frontend-artifacts
  before_script:
    - |
      export DOCKER_HOST=tcp://docker:2375
      echo "Waiting for Docker daemon..."
      timeout=60
      elapsed=0
      until docker info >/dev/null 2>&1; do
        if [ $elapsed -ge $timeout ]; then
          echo "ERROR: Docker daemon did not become ready within ${timeout}s"
          exit 1
        fi
        echo "Docker daemon not ready, waiting... (${elapsed}s/${timeout}s)"
        sleep 2
        elapsed=$((elapsed + 2))
      done
    - docker buildx version || docker buildx install
    - docker buildx create --use --name builder --driver docker-container || true
    - |
      if [ -n "${REGISTRY_HOST}" ] && [ -n "${REGISTRY_USERNAME}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        echo "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USERNAME}" --password-stdin "${REGISTRY_HOST}"
      else
        echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
      fi
  script:
    - |
      # Note: The package file (tar.gz) already contains the frontend inside it.
      # During build-backend, make package copies webapp/channels/dist/* into server/dist/mattermost/client/
      # So the Docker image will have both backend and frontend from this single package file.
      # Find the built package
      PACKAGE_FILE=$(find server/dist -name "mattermost-*-linux-amd64.tar.gz" | head -n 1)
      if [ -z "$PACKAGE_FILE" ]; then
        echo "ERROR: Package file not found in server/dist/"
        ls -la server/dist/ || true
        exit 1
      fi

      # Copy package to build context for Dockerfile
      mkdir -p server/build/package
      cp "$PACKAGE_FILE" server/build/package/
      PACKAGE_NAME=$(basename "$PACKAGE_FILE")

      # Create a simple HTTP server to serve the package (as original Dockerfile expects URL)
      # Or use the original Dockerfile with local file modification
      # Actually, let's use the original Dockerfile approach but serve package via HTTP
      cd server/build/package
      python3 -m http.server 8000 > /tmp/http-server.log 2>&1 &
      HTTP_SERVER_PID=$!
      sleep 2

      # Get absolute path for the package URL
      # Use localhost since we're in the same container
      MM_PACKAGE="http://localhost:8000/${PACKAGE_NAME}"

      # Set image tags
      if [ -n "${REGISTRY_HOST}" ]; then
        tag="${REGISTRY_HOST}/${CI_PROJECT_PATH}/server:${CI_COMMIT_SHORT_SHA}"
        branch_tag="${REGISTRY_HOST}/${CI_PROJECT_PATH}/server:${CI_COMMIT_BRANCH}"
      else
        tag="${CI_REGISTRY_IMAGE}/server:${CI_COMMIT_SHORT_SHA}"
        branch_tag="${CI_REGISTRY_IMAGE}/server:${CI_COMMIT_BRANCH}"
      fi

      # Build using original Dockerfile with MM_PACKAGE pointing to local HTTP server
      cd ..
      docker buildx build \
        --pull \
        --push \
        --platform linux/amd64 \
        --build-arg MM_PACKAGE="${MM_PACKAGE}" \
        -t "${tag}" \
        -t "${branch_tag}" \
        -f Dockerfile \
        .

      # Stop HTTP server
      kill $HTTP_SERVER_PID || true
